<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WxClawBotPush - 管理面板</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; }
.header { background: #fff; border-bottom: 1px solid #e8e8e8; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 18px; color: #1a1a1a; }
.header .right { display: flex; align-items: center; gap: 12px; }
.header .right span { font-size: 14px; color: #666; }
.header button { background: none; border: 1px solid #d9d9d9; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
.container { max-width: 900px; margin: 24px auto; padding: 0 16px; }
.card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); padding: 24px; margin-bottom: 16px; }
.card h2 { font-size: 16px; margin-bottom: 16px; color: #333; }
.form-row { display: flex; gap: 12px; margin-bottom: 12px; }
.form-row input { flex: 1; padding: 8px 12px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px; }
.form-row input:focus { outline: none; border-color: #07c160; }
.btn { padding: 8px 20px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
.btn-green { background: #07c160; color: #fff; }
.btn-green:hover { background: #06ad56; }
.btn-red { background: #e74c3c; color: #fff; }
.btn-red:hover { background: #c0392b; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
th { color: #999; font-weight: 500; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
.badge-on { background: #e6f9f0; color: #07c160; }
.badge-off { background: #f5f5f5; color: #999; }
.hidden { display: none; }
textarea { width: 100%; padding: 8px 12px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px; font-family: monospace; resize: vertical; min-height: 80px; }
textarea:focus { outline: none; border-color: #07c160; }
.tokencopy { font-family: monospace; font-size: 13px; word-break: break-all; background: #f5f5f5; padding: 8px 12px; border-radius: 4px; margin: 8px 0; }
.code { background: #f5f5f5; padding: 2px 6px; border-radius: 3px; font-family: monospace; font-size: 13px; }
</style>
</head>
<body>
<div class="header">
  <h1>WxClawBotPush</h1>
  <div class="right">
    <span id="headerUser"></span>
    <button onclick="logout()">退出</button>
  </div>
</div>
<div class="container" id="app"></div>
<script>
// ── 全局状态 ────────────────────────────────────────────────
var token = localStorage.getItem('token');
if (!token) window.location.href = '/login.html';

var qrPollTimer = null;      // 扫码状态轮询定时器
var qrPollCount = 0;        // 轮询次数（2s * 90 = 3分钟超时）
var QR_POLL_MAX = 90;       // 最大轮询次数
var isAdmin = false;        // 是否为管理员

// API 请求封装（自动携带 Authorization header）
var api = function(url, opts) {
  opts = opts || {};
  opts.headers = Object.assign({}, opts.headers || {}, {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token});
  return fetch(url, opts).then(function(r) { return r.json(); });
};

// ── 页面初始化 ──────────────────────────────────────────────

async function load() {
  var resp = await api('/api/user/config');
  if (resp.detail && resp.detail.indexOf('登录') >= 0) { window.location.href = '/login.html'; return; }

  var statusResp = await api('/api/user/status');
  var statsResp = await api('/api/admin/stats');
  isAdmin = statsResp.total_users !== undefined;

  document.getElementById('headerUser').textContent = '';

  var html = '';
  if (isAdmin) {
    html += renderAdminPanel(resp, statusResp, statsResp);
  }
  html += renderUserPanel(resp, statusResp);

  document.getElementById('app').innerHTML = html;
  if (isAdmin) loadUsers();
}

// ── 管理员面板渲染 ──────────────────────────────────────────

function renderAdminPanel(cfg, status, stats) {
  return '<div class="card">' +
    '<h2>系统看板</h2>' +
    '<div id="statsTable">' +
      '<table><tr><td>总用户</td><td>' + stats.total_users + '</td></tr></table>' +
    '</div>' +
    '<div style="margin-top:16px">' +
      '<input type="checkbox" id="regToggle" onchange="toggleReg(this.checked)">' +
      '<label for="regToggle" style="font-size:14px">开放注册</label>' +
    '</div>' +
    '<h2 style="margin-top:20px">用户管理</h2>' +
    '<div id="userList"></div>' +
    '<div class="form-row" style="margin-top:12px">' +
      '<input type="text" id="newUsername" placeholder="用户名">' +
      '<input type="password" id="newPassword" placeholder="密码">' +
      '<button class="btn btn-green" onclick="createUser()">创建用户</button>' +
    '</div>' +
  '</div>';
}

// ── 用户面板渲染 ────────────────────────────────────────────

function renderUserPanel(cfg, status) {
  var html = '<div class="card"><h2>个人设置</h2>';

  // 微信连接状态（可刷新的区域）
  html += '<div id="connectionStatus">';
  if (status.connected) {
    html += '<p style="color:#07c160;font-size:14px">微信已连接 (' + (status.account_id || '未知账号') + ')</p>';
    html += '<p style="font-size:13px;color:#666;margin-top:4px">已知联系人: <span id="knownUsersCount">' + (status.known_users || 0) + '</span> 个</p>';
    html += '<button class="btn btn-red" onclick="logoutBot()">断开微信</button>';
  } else {
    html += '<p style="color:#999;font-size:14px">微信未连接</p>';
    html += '<button class="btn btn-green" onclick="getQrCode()">扫码登录</button>';
  }
  html += '</div>';
  html += '<div id="qrcodeArea" style="margin-top:12px"></div>';

  // Webhook Token
  html += '<h2 style="margin-top:24px">Webhook Token</h2>';
  html += '<div class="tokencopy">' + cfg.webhook_token + '</div>';
  html += '<button class="btn btn-green" onclick="resetToken()">重置 Token</button>';
  var origin = window.location.origin;
  html += '<p style="font-size:12px;color:#999;margin-top:4px">推送地址: <span class="code">GET/POST ' + origin + '/webhook?token=' + cfg.webhook_token + '</span></p>';

  // 消息模板
  html += '<h2 style="margin-top:24px">消息模板</h2>';
  html += '<textarea id="templateInput">' + (cfg.message_template || '') + '</textarea>';
  html += '<button class="btn btn-green" style="margin-top:8px" onclick="saveTemplate()">保存模板</button>';
  html += '<p style="font-size:12px;color:#999;margin-top:4px">占位符: <span class="code">{{ field }}</span> 支持嵌套如 <span class="code">{{ alert.name }}</span></p>';

  // 修改密码
  html += '<h2 style="margin-top:24px">修改密码</h2>';
  html += '<input type="password" id="currentPassword" placeholder="当前密码" style="width:100%;padding:8px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:14px;margin-bottom:8px">';
  html += '<input type="password" id="newPassword" placeholder="新密码（至少6位）" style="width:100%;padding:8px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:14px;margin-bottom:8px">';
  html += '<input type="password" id="confirmPassword" placeholder="确认新密码" style="width:100%;padding:8px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:14px;margin-bottom:8px">';
  html += '<button class="btn btn-green" onclick="changePassword()">修改密码</button>';

  // 注销账号
  html += '<h2 style="margin-top:24px;color:#e74c3c">注销账号</h2>';
  html += '<p style="font-size:13px;color:#999;margin-bottom:8px">注销后所有数据将被永久删除，无法恢复。</p>';
  html += '<button class="btn btn-red" onclick="deactivateAccount()">注销我的账号</button>';

  html += '</div>';
  return html;
}

// ── 二维码扫码状态轮询 ──────────────────────────────────────

/* 每 2 秒检查一次扫码状态，连接成功后自动刷新页面，3 分钟后超时停止 */
async function pollQrStatus() {
  qrPollCount++;
  if (qrPollCount >= QR_POLL_MAX) {
    clearInterval(qrPollTimer);
    qrPollTimer = null;
    document.getElementById('qrcodeArea').innerHTML =
      '<p style="font-size:13px;color:#e74c3c">二维码已过期，请重新获取</p>';
    return;
  }
  try {
    var resp = await api('/api/user/status');
    if (resp.connected) {
      clearInterval(qrPollTimer);
      qrPollTimer = null;
      location.reload();
    }
  } catch(e) {}
}

// 页面切到后台时暂停轮询，切回时继续
document.addEventListener('visibilitychange', function() {
  if (!qrPollTimer) return;
  if (document.hidden) {
    clearInterval(qrPollTimer);
    qrPollTimer = null;
  } else {
    qrPollTimer = setInterval(pollQrStatus, 2000);
  }
});

// ── 用户操作 ────────────────────────────────────────────────

async function getQrCode() {
  try {
    var resp = await api('/api/user/qrcode');
    if (resp.qrcode_url) {
      document.getElementById('qrcodeArea').innerHTML =
        '<p style="font-size:13px;color:#666;margin-bottom:8px">请用微信扫描二维码（扫描后自动刷新）</p>' +
        '<img src="/api/user/qrcode/image?t=' + Date.now() + '" style="width:280px;height:280px" onerror="setTimeout(getQrCode, 3000)">';
      // 启动扫码状态轮询
      if (qrPollTimer) clearInterval(qrPollTimer);
      qrPollCount = 0;
      qrPollTimer = setInterval(pollQrStatus, 2000);
    }
  } catch(e) {}
}

async function logoutBot() {
  await api('/api/user/logout', { method: 'POST' });
  location.reload();
}

async function resetToken() {
  await api('/api/user/token', { method: 'POST' });
  location.reload();
}

async function saveTemplate() {
  var tpl = document.getElementById('templateInput').value;
  await api('/api/user/config', { method: 'PUT', body: JSON.stringify({ message_template: tpl }) });
  alert('模板已保存');
}

async function loadStats() {
  var resp = await api('/api/admin/stats');
  if (resp.total_users !== undefined) {
    document.getElementById('statsTable').innerHTML =
      '<table><tr><td>总用户</td><td>' + resp.total_users + '</td></tr></table>';
  }
}

async function loadUsers() {
  var resp = await api('/api/admin/users');
  var users = resp.users || [];
  document.getElementById('userList').innerHTML = '<table><tr><th>ID</th><th>用户名</th><th>角色</th><th>状态</th><th>微信</th><th>创建时间</th><th>操作</th></tr>' +
    users.map(function(u) { return '<tr>' +
      '<td>' + u.id + '</td><td>' + u.username + '</td>' +
      '<td>' + (u.is_admin ? '管理员' : '用户') + '</td>' +
      '<td><span class="badge ' + (u.is_disabled ? 'badge-off' : 'badge-on') + '">' + (u.is_disabled ? '已禁用' : '正常') + '</span></td>' +
      '<td><span class="badge ' + (u.is_connected ? 'badge-on' : 'badge-off') + '">' + (u.is_connected ? '已连接' : '未连接') + '</span></td>' +
      '<td>' + u.created_at + '</td>' +
      '<td>' +
        '<button onclick="toggleUser(' + u.id + ', ' + (!u.is_disabled) + ')">' + (u.is_disabled ? '启用' : '禁用') + '</button>' +
        '<button onclick="deleteUser(' + u.id + ')" style="color:#e74c3c;margin-left:4px">删除</button>' +
      '</td>' +
    '</tr>'; }).join('') +
  '</table>';
}

// ── 管理员操作 ──────────────────────────────────────────────

async function toggleReg(v) {
  await api('/api/admin/config', { method: 'PUT', body: JSON.stringify({ registration_open: v ? '1' : '0' }) });
}

async function createUser() {
  var username = document.getElementById('newUsername').value;
  var password = document.getElementById('newPassword').value;
  if (!username || !password) { alert('请填写用户名和密码'); return; }
  await api('/api/admin/users', { method: 'POST', body: JSON.stringify({ username: username, password: password }) });
  loadUsers();
  loadStats();
}

async function toggleUser(id, disabled) {
  await api('/api/admin/users/' + id, { method: 'PUT', body: JSON.stringify({ is_disabled: disabled ? 1 : 0 }) });
  loadUsers();
}

async function deleteUser(id) {
  if (!confirm('确定删除该用户？')) return;
  await api('/api/admin/users/' + id, { method: 'DELETE' });
  loadUsers();
  loadStats();
}

// ── 个人设置操作 ────────────────────────────────────────────

async function changePassword() {
  var currentPassword = document.getElementById('currentPassword').value;
  var newPassword = document.getElementById('newPassword').value;
  var confirmPassword = document.getElementById('confirmPassword').value;
  if (!currentPassword || !newPassword || !confirmPassword) { alert('请填写所有密码字段'); return; }
  if (newPassword.length < 6) { alert('新密码至少6位'); return; }
  if (newPassword !== confirmPassword) { alert('两次输入的新密码不一致'); return; }
  var resp = await api('/api/user/change-password', { method: 'POST', body: JSON.stringify({ current_password: currentPassword, new_password: newPassword }) });
  if (resp.success) {
    alert('密码修改成功，请重新登录');
    localStorage.removeItem('token');
    window.location.href = '/login.html';
  } else {
    alert(resp.detail || '修改失败');
  }
}

async function deactivateAccount() {
  if (!confirm('确定要注销账号吗？所有数据将被永久删除，此操作不可撤销！')) return;
  if (!confirm('再次确认：注销后数据将无法恢复，确定继续？')) return;
  var resp = await api('/api/user/deactivate', { method: 'POST' });
  if (resp.success) {
    localStorage.removeItem('token');
    window.location.href = '/login.html';
  } else {
    alert(resp.detail || '注销失败');
  }
}

function logout() {
  api('/api/logout', { method: 'POST' });
  localStorage.removeItem('token');
  window.location.href = '/login.html';
}

// ── 启动 ────────────────────────────────────────────────────
load();
</script>
</body>
</html>
