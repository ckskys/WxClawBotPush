<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WxClawBotPush - 登录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── 设计令牌 ─────────────────────────────────────────────── */
:root {
  --color-primary: #1E3A5F;
  --color-on-primary: #FFFFFF;
  --color-secondary: #2563EB;
  --color-accent: #059669;
  --color-background: #F8FAFC;
  --color-surface: #FFFFFF;
  --color-foreground: #0F172A;
  --color-muted: #F1F3F5;
  --color-border: #E4E7EB;
  --color-destructive: #DC2626;
  --color-text: #1E293B;
  --color-text-secondary: #64748B;
  --color-text-muted: #94A3B8;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --shadow-md: 0 1px 3px 0 rgba(0,0,0,0.08), 0 1px 2px -1px rgba(0,0,0,0.06);
  --shadow-lg: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
  --transition: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --font-sans: 'Fira Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'Fira Code', 'SF Mono', 'Cascadia Code', monospace;
}

/* ── 基础 ─────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  font-size: 14px; line-height: 1.6;
  color: var(--color-text);
  background: var(--color-background);
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.card {
  background: var(--color-surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--color-border);
  padding: 36px; width: 380px; max-width: calc(100vw - 32px);
}

h1 {
  text-align: center; margin-bottom: 24px;
  font-size: 20px; font-weight: 700; color: var(--color-primary);
  letter-spacing: -0.02em;
}

/* ── Tab 切换 ─────────────────────────────────────────────── */
.tabs {
  display: flex; margin-bottom: 24px;
  border-bottom: 2px solid var(--color-muted);
}
.tab {
  flex: 1; text-align: center; padding: 8px 0;
  cursor: pointer; font-size: 14px; font-weight: 500;
  color: var(--color-text-muted);
  border-bottom: 2px solid transparent; margin-bottom: -2px;
  transition: all var(--transition); user-select: none;
}
.tab:hover { color: var(--color-text-secondary); }
.tab.active { color: var(--color-accent); border-bottom-color: var(--color-accent); }

/* ── 表单 ─────────────────────────────────────────────────── */
label {
  display: block; margin-bottom: 4px;
  font-size: 13px; font-weight: 500; color: var(--color-text-secondary);
}
input[type="text"], input[type="password"] {
  width: 100%; padding: 9px 12px; border: 1px solid var(--color-border);
  border-radius: var(--radius-sm); font-size: 14px; font-family: var(--font-sans);
  color: var(--color-text); background: var(--color-surface);
  margin-bottom: 16px;
  transition: border-color var(--transition), box-shadow var(--transition);
}
input:focus {
  outline: none; border-color: var(--color-secondary);
  box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
}
input::placeholder { color: var(--color-text-muted); }

.btn {
  width: 100%; padding: 10px; border: none;
  border-radius: var(--radius-sm); font-size: 14px; font-weight: 600;
  font-family: var(--font-sans); cursor: pointer;
  transition: all var(--transition);
}
.btn:focus-visible { outline: 2px solid var(--color-secondary); outline-offset: 2px; }
.btn-primary { background: var(--color-accent); color: #fff; }
.btn-primary:hover { background: #047A57; }
.btn-primary:active { background: #036645; }

.error {
  color: var(--color-destructive); font-size: 13px;
  margin-bottom: 12px; text-align: center;
}
.hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>WxClawBotPush</h1>
  <div class="tabs">
    <div class="tab active" data-tab="login">登录</div>
    <div class="tab" data-tab="register">注册</div>
  </div>
  <div id="error" class="error hidden"></div>
  <form id="loginForm">
    <label>用户名</label>
    <input type="text" id="username" autocomplete="username" required minlength="3">
    <label>密码</label>
    <input type="password" id="password" autocomplete="current-password" required minlength="6">
    <button type="submit" class="btn btn-primary">登录</button>
  </form>
  <form id="registerForm" class="hidden">
    <label>用户名</label>
    <input type="text" id="regUsername" required minlength="3">
    <label>密码</label>
    <input type="password" id="regPassword" required minlength="6">
    <button type="submit" class="btn btn-primary">注册</button>
  </form>
</div>
<script>
var tabs = document.querySelectorAll('.tab');
tabs.forEach(function(t) { t.addEventListener('click', function() {
  tabs.forEach(function(x) { x.classList.remove('active'); });
  t.classList.add('active');
  var isLogin = t.dataset.tab === 'login';
  document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
  document.getElementById('registerForm').classList.toggle('hidden', isLogin);
  document.getElementById('error').classList.add('hidden');
});});

document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  var username = document.getElementById('username').value;
  var password = document.getElementById('password').value;
  var resp = await fetch('/api/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: username, password: password}) });
  var data = await resp.json();
  if (resp.ok) {
    localStorage.setItem('token', data.token);
    window.location.href = '/admin';
  } else {
    var err = document.getElementById('error');
    err.textContent = data.detail || '登录失败';
    err.classList.remove('hidden');
  }
});

document.getElementById('registerForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  var username = document.getElementById('regUsername').value;
  var password = document.getElementById('regPassword').value;
  var resp = await fetch('/api/register', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: username, password: password}) });
  var data = await resp.json();
  if (resp.ok) {
    localStorage.setItem('token', data.token);
    window.location.href = '/admin';
  } else {
    var err = document.getElementById('error');
    err.textContent = data.detail || '注册失败';
    err.classList.remove('hidden');
  }
});
</script>
</body>
</html>
